    <title>«·ÃÌÊ·ÊÃÌ« «·⁄«„… ··”‰… «·À«·À… «» œ«∆Ì</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0b0f15 0%, #1a1f2b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: #e0e8f5;
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #2e3a4a;
            padding-bottom: 0.75rem;
            display: inline-block;
            text-align: center;
        }

        /* main layout: left player, right list */
        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            max-width: 1400px;
            width: 100%;
            align-items: stretch;
        }

        /* left: big video player */
        .player-panel {
            flex: 1 1 65%;
            min-width: 0;
            background: #11161f;
            border-radius: 1.75rem;
            padding: 1rem;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a3442 inset;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            width: 100%;
            -webkit-user-drag: none;
            user-drag: none;
            flex-shrink: 0;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
            pointer-events: auto;
            -webkit-user-drag: none;
        }

        video::-internal-media-controls-download-button {
            display: none !important;
        }
        video::-moz-media-controls-download-button {
            display: none !important;
        }
        video::-webkit-media-controls {
            overflow: hidden !important;
        }

        .player-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 0.5rem 0.2rem 0.5rem;
            color: #b0c2dc;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .lock-icon {
            font-size: 1rem;
            opacity: 0.7;
            margin-right: 6px;
        }

        .badge {
            background: #1e2a3a;
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #7f93b0;
            border: 1px solid #31445b;
            font-weight: 400;
        }

        /* right: list of videos */
        .list-panel {
            flex: 0 0 300px;
            background: #11161f;
            border-radius: 1.75rem;
            padding: 1.25rem 1rem;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a3442 inset;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .list-panel h2 {
            color: #c0d0e8;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #2e3a4a;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.85rem 1rem;
            background: #1a212c;
            border-radius: 1rem;
            border: 1px solid #26303e;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #b8c9e0;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .video-item:hover {
            background: #222d3d;
            border-color: #3e5269;
            transform: translateX(4px);
        }

        .video-item.active {
            background: #1e3148;
            border-color: #4e7eb3;
            box-shadow: 0 0 0 1px #4e7eb3 inset, 0 4px 12px rgba(0, 100, 200, 0.2);
            color: #ffffff;
        }

        .video-item .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: #0e141e;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7f9ac0;
            border: 1px solid #2c3d52;
            flex-shrink: 0;
        }

        .video-item.active .num {
            background: #2a4a6a;
            color: #fff;
            border-color: #6b9fd6;
        }

        .video-item .item-title {
            flex: 1;
        }

        .video-item .item-icon {
            opacity: 0.5;
            font-size: 1rem;
        }

        .video-item.active .item-icon {
            opacity: 1;
        }

        /* notice */
        .notice {
            margin-top: 2rem;
            color: #5f7188;
            font-size: 0.85rem;
            text-align: center;
            background: #0e131c;
            padding: 0.9rem 2rem;
            border-radius: 40px;
            border: 1px solid #26303e;
            backdrop-filter: blur(8px);
            max-width: 750px;
            line-height: 1.5;
            width: 100%;
        }

        .notice span {
            color: #9bb1d0;
            font-weight: 500;
        }

        .path-hint {
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: #4a5b72;
            letter-spacing: 0.5px;
            font-family: monospace;
            background: #0b1018;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #1e2938;
        }

        /* responsive: stack on smaller screens */
        @media (max-width: 850px) {
            .main-layout {
                flex-direction: column;
            }
            .list-panel {
                flex: 0 0 auto;
                max-height: none;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .list-panel h2 {
                width: 100%;
                justify-content: center;
            }
            .video-item {
                flex: 1 0 150px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>

    <h1> ENSL «·ÃÌÊ·ÊÃÌ« «·⁄«„… ··”‰… «·À«·À… «» œ«∆Ì</h1>

    <div class="main-layout">
        <!-- LEFT: big player -->
        <div class="player-panel">
            <div class="video-wrapper">
                <video 
                    controls 
                    controlsList="nodownload noplaybackrate nofullscreen" 
                    disablePictureInPicture
                    playsinline

                    id="mainVideo"
                >
                    <source id="mainSource" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- RIGHT: list of videos -->
        <div class="list-panel" id="listPanel">
            <h2>«·ﬁ«∆„…</h2>
            <div class="video-item active" data-index="1" 
                 data-src="https://drive.google.com/file/d/1HYb_6a3s_vTX-9Bovq1h8uKoF1jCKc-A/preview" 
                 data-title="«·„Õ«÷—… «·√Ê·Ï">

                 data-src="https://drive.google.com/file/d/1YOUR_VIDEO_ID_2/preview" 
                 data-title="«·„Õ«÷—… «·À«‰Ì…">
                <span class="num">2</span>

            </div>
            <div class="video-item" data-index="3" 
                 data-src="https://drive.google.com/file/d/1YOUR_VIDEO_ID_3/preview" 
                 data-title="«·„Õ«÷—… «·À«·À…">
                <span class="num">3</span>

            </div>
            <div class="video-item" data-index="4" 
                 data-src="https://drive.google.com/file/d/1YOUR_VIDEO_ID_4/preview" 
                 data-title="«·„Õ«÷—… «·—«»⁄…">
                <span class="num">4</span>
                <span class="item-title">«·„Õ«÷—… «·—«»⁄…</span>

    <script>
        (function() {
            // ---- Video player logic ----
            const mainVideo = document.getElementById('mainVideo');
            const mainSource = document.getElementById('mainSource');
            const videoItems = document.querySelectorAll('.video-item');

            // function to switch video
            function switchVideo(item) {
                // remove active class from all
                videoItems.forEach(el => el.classList.remove('active'));
                // add active to clicked
                item.classList.add('active');

                const newSrc = item.getAttribute('data-src');

                // pause current video and reset
                mainVideo.pause();
                mainVideo.currentTime = 0;

                // update source
                mainSource.src = newSrc;
                mainVideo.load(); // reload to apply new source

                // optional: autoplay? No, leave it to user.
            }

            // add click listeners to each list item
            videoItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    switchVideo(this);
                });
            });

            // Load the first video initially (the active one)
            const firstItem = document.querySelector('.video-item.active');
            if (firstItem) {
                const initialSrc = firstItem.getAttribute('data-src');
                mainSource.src = initialSrc;
                mainVideo.load();
            }

            // ---- PROTECTION LAYER ----
            // 1. Disable right-click on whole document
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            }, { capture: true });

            // 2. Prevent drag & drop on video and wrappers
            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
                video.addEventListener('dragstart', (e) => {
                    e.preventDefault();
                    return false;
                });
                const wrapper = video.closest('.video-wrapper');
                if (wrapper) {
                    wrapper.addEventListener('dragstart', (e) => e.preventDefault());
                }
            });

            // 3. Block copy/cut on video
            videos.forEach(video => {
                video.addEventListener('copy', (e) => e.preventDefault());
                video.addEventListener('cut', (e) => e.preventDefault());
            });

            // 4. Disable save shortcuts
            window.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    alert('Downloading is disabled for protected videos.');
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 's') {
                    e.preventDefault();
                    return false;
                }
            });

            // 5. Remove download attribute if present
            videos.forEach(video => {
                if (video.hasAttribute('download')) {
                    video.removeAttribute('download');
                }
            });

            // 6. Block middle-click on video
            videos.forEach(video => {
                video.addEventListener('auxclick', function(e) {
                    if (e.button === 1) {
                        e.preventDefault();
                        return false;
                    }
                });
            });

            // 7. Also block middle-click on list items
            videoItems.forEach(item => {
                item.addEventListener('auxclick', function(e) {
                    if (e.button === 1) {
                        e.preventDefault();
                        return false;
                    }
                });
            });

            // 8. Extra: prevent dragging from list item
            videoItems.forEach(item => {
                item.addEventListener('dragstart', (e) => e.preventDefault());
            });

            console.log('?? Protected single-player gallery ready. Using Google Drive preview links.');
        })();
    </script>

    <!-- Extra CSS reinforcement for hiding download buttons -->
    <style>

        .player-label, .video-item {
            user-select: none;

    </style>
