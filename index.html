<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجيولوجيا العامة للسنة الثالثة ابتدائي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0b0f15 0%, #1a1f2b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: #e0e8f5;
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #2e3a4a;
            padding-bottom: 0.75rem;
            display: inline-block;
            text-align: center;
        }

        /* main layout: left player, right list */
        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            max-width: 1400px;
            width: 100%;
            align-items: stretch;
        }

        /* left: big video player */
        .player-panel {
            flex: 1 1 65%;
            min-width: 0;
            background: #11161f;
            border-radius: 1.75rem;
            padding: 1rem;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a3442 inset;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            width: 100%;
            flex-shrink: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        /* right: list of videos */
        .list-panel {
            flex: 0 0 300px;
            background: #11161f;
            border-radius: 1.75rem;
            padding: 1.25rem 1rem;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a3442 inset;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .list-panel h2 {
            color: #c0d0e8;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #2e3a4a;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.85rem 1rem;
            background: #1a212c;
            border-radius: 1rem;
            border: 1px solid #26303e;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #b8c9e0;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .video-item:hover {
            background: #222d3d;
            border-color: #3e5269;
            transform: translateX(4px);
        }

        .video-item.active {
            background: #1e3148;
            border-color: #4e7eb3;
            box-shadow: 0 0 0 1px #4e7eb3 inset, 0 4px 12px rgba(0, 100, 200, 0.2);
            color: #ffffff;
        }

        .video-item .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: #0e141e;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7f9ac0;
            border: 1px solid #2c3d52;
            flex-shrink: 0;
        }

        .video-item.active .num {
            background: #2a4a6a;
            color: #fff;
            border-color: #6b9fd6;
        }

        .video-item .item-title {
            flex: 1;
        }

        /* responsive: stack on smaller screens */
        @media (max-width: 850px) {
            .main-layout {
                flex-direction: column;
            }
            .list-panel {
                flex: 0 0 auto;
                max-height: none;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .list-panel h2 {
                width: 100%;
                justify-content: center;
            }
            .video-item {
                flex: 1 0 150px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>

    <h1> ENSL الجيولوجيا العامة للسنة الثالثة ابتدائي</h1>

    <div class="main-layout">
        <!-- LEFT: iframe player -->
        <div class="player-panel">
            <div class="video-wrapper">
                <iframe
                    id="mainFrame"
                    src="https://drive.google.com/file/d/1ZT9N3JUwGu2yQIAtgMJGdlboieDHYFZu/preview"
                    allow="autoplay; encrypted-media"
                    allowfullscreen
                    referrerpolicy="no-referrer"
                ></iframe>
            </div>
        </div>

        <!-- RIGHT: list of videos -->
        <div class="list-panel" id="listPanel">
            <h2>القائمة</h2>
            <div class="video-item active" data-index="1"
                 data-src="https://drive.google.com/file/d/1pW--YeCffRhmT1V15ngMP6JvY9A6395M/preview"
                 data-title="المحاضرة الأولى">
                <span class="num">1</span>
                <span class="item-title">المحاضرة الأولى</span>
            </div>
            <div class="video-item" data-index="2"
                 data-src="https://drive.google.com/file/d/1RQSq09_TN3LG6jVUxKu93uVOl6dcUTS1/preview"
                 data-title="المحاضرة الثانية">
                <span class="num">2</span>
                <span class="item-title">المحاضرة الثانية</span>
            </div>
            <div class="video-item" data-index="3"
                 data-src="https://drive.google.com/file/d/1HYb_6a3s_vTX-9Bovq1h8uKoF1jCKc-A/preview"
                 data-title="المحاضرة الثالثة">
                <span class="num">3</span>
                <span class="item-title">المحاضرة الثالثة</span>
            </div>
            <div class="video-item" data-index="4"
                 data-src="https://drive.google.com/file/d/12UnZK-leSebo74CRScdQkl4gn4jtZX0J/preview"
                 data-title="المحاضرة الرابعة">
                <span class="num">4</span>
                <span class="item-title">المحاضرة الرابعة</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---- Iframe player logic ----
            const mainFrame = document.getElementById('mainFrame');
            const videoItems = document.querySelectorAll('.video-item');

            // function to switch video
            function switchVideo(item) {
                // remove active class from all
                videoItems.forEach(el => el.classList.remove('active'));
                // add active to clicked
                item.classList.add('active');

                const newSrc = item.getAttribute('data-src');

                // update iframe source
                mainFrame.src = newSrc;
            }

            // add click listeners to each list item
            videoItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    switchVideo(this);
                });
            });

            // Load the first video initially (the active one) — already set in HTML
            // but we ensure the src matches the active item just in case
            const firstItem = document.querySelector('.video-item.active');
            if (firstItem) {
                const initialSrc = firstItem.getAttribute('data-src');
                if (mainFrame.src !== initialSrc) {
                    mainFrame.src = initialSrc;
                }
            }

            // ---- PROTECTION LAYER ----
            // 1. Disable right-click on the whole document
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            }, { capture: true });

            // 2. Disable save shortcuts
            window.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    alert('Downloading is disabled for protected videos.');
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 's') {
                    e.preventDefault();
                    return false;
                }
            });

            // 3. Block middle-click on list items (prevent open in new tab)
            videoItems.forEach(item => {
                item.addEventListener('auxclick', function(e) {
                    if (e.button === 1) {
                        e.preventDefault();
                        return false;
                    }
                });
                item.addEventListener('dragstart', (e) => e.preventDefault());
            });

            // 4. Prevent dragging on the iframe wrapper
            const wrapper = document.querySelector('.video-wrapper');
            if (wrapper) {
                wrapper.addEventListener('dragstart', (e) => e.preventDefault());
            }

            console.log('?? Iframe gallery ready. Using Google Drive /preview links.');
        })();
    </script>

    <!-- Extra CSS for selection prevention -->
    <style>
        .video-item, .video-wrapper {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</body>
</html>
